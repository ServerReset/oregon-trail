name: Instrumented smoke test

# This job boots a full Android emulator and drives the real app with
# tools/ot_smoke.py. Emulator boot on hosted runners is slow, so the job is
# run on demand (or for a release tag) and is marked continue-on-error: a
# flaky emulator will not turn the build red, but the smoke output is still
# in the logs. The fast JVM tests run on every push in "Android CI".
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Drive the debug app on an emulator
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate the Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER=$(command -v sdkmanager || find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run the game on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 1200
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: |
            adb wait-for-device
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            python3 tools/ot_smoke.py --max-steps 400
