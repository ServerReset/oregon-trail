name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run engine unit tests
        run: ./gradlew :engine:test --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Decode the release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > ci-release.keystore
            echo "Release keystore decoded."
          else
            echo "No keystore secret; the APK will be debug-signed."
          fi

      - name: Build release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Read the app version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Stage the release APK
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/oregon-trail.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: oregon-trail-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: oregon-trail-release
          path: app/build/outputs/apk/release/oregon-trail.apk
          if-no-files-found: error

      - name: Publish the APK on GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: The Oregon Trail - ASCII Edition v${{ steps.version.outputs.name }}
          body: |
            Automatically built and published from `${{ github.sha }}`.

            Download **oregon-trail.apk** below and install it on Android 7.0+
            with `adb install oregon-trail.apk`, or by opening the file on your
            device.
          files: |
            app/build/outputs/apk/release/oregon-trail.apk
          make_latest: true
          fail_on_unmatched_files: true
